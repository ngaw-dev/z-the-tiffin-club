name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Pint · PHPStan · Tests (PHP 8.3 / MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tiffin_test
          MYSQL_USER: tiffin
          MYSQL_PASSWORD: tiffin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tiffin_test
      DB_USERNAME: tiffin
      DB_PASSWORD: tiffin

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, intl, bcmath
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping --host=127.0.0.1 --user=tiffin --password=tiffin --silent 2>/dev/null; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"; exit 1

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: php artisan test
